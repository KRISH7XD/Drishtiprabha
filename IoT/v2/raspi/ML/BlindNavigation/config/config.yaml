model:
  yolo_weights: "yolov8n.pt"
sensor:
  trig_pin: 15
  echo_pin: 16
  vibration_pin: 18
  i2c_bus: 1
  extra_sensors:
    - [11, 12]  # Example: left sensor
path_planning:
  grid_size: [10, 10]
  grid_resolution: 1.0
  target_pos: [5, 0]
feedback:
  speech_rate: 150
  min_speech_interval: 2.0
  min_vibration_interval: 1.0